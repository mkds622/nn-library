[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "bonsai-nn-library"
description = "Common PyTorch utilities for research projects on neural networks."
readme = "README.md"
requires-python = ">= 3.12"
version = "0.7.2"
license = { text = "MIT" }
authors = [
    { name = "Richard Lange", email = "opensource@bonsai-neuro-ai.com" },
]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jsonargparse",
    "matplotlib",
    "mlflow",
    "numpy",
    "pandas",
    "parse",
    "pycocotools",
    "pydot",
    "pylint>=4.0.7",
    "pyyaml",
    "scikit-learn",
    "scipy",
    "seaborn",
    "tabulate",
    "torchmetrics",
    "tqdm",
    "typing_extensions; python_version < '3.13'",
]

[project.optional-dependencies]
dev = [
    "coverage",
    "coverage-badge",
    "interrogate",
]
# CPU/CUDA guide: https://docs.astral.sh/uv/guides/integration/pytorch/#configuring-accelerators-with-optional-dependencies
cpu = [
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]
cu130 = [
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu130" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.urls]
Repository = "https://github.com/bonsai-neuro-ai/nn-library"

[tool.black]
line-length = 100

[tool.interrogate]
fail-under = 50
verbose = 1
exclude = ["dist", "build", "tests", "demos", "scripts"]
